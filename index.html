<style>
  :root{
    --paper:#E7E8E2;
    --paper-2:#DEE0D8;
    --ink:#23282A;
    --muted:#8E948F;
    --flow-a:#16A0A6;
    --flow-b:#3D3AA8;
    --accent:#B33B86;

    --display:"Zen Old Mincho", ui-serif, "Hiragino Mincho ProN", serif;
    --body:"Zen Kaku Gothic New", ui-sans-serif, "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --mono:"DM Mono", ui-monospace, monospace;

    --spine-x:clamp(22px, 6vw, 44px);   /* 線の位置 */
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    line-height:1.8;
  }
  a{color:inherit}

  .page{
    max-width:640px;
    margin:0 auto;
    padding:clamp(40px,9vh,96px) clamp(20px,5vw,40px) 64px;
  }

  /* ---------- 線（この頁の背骨） ---------- */
  .spine{
    position:relative;
    padding-left:var(--spine-x);
  }
  .spine::before{
    content:"";
    position:absolute;
    left:0;
    top:.5em;
    bottom:0;
    width:2px;
    background:linear-gradient(to bottom, var(--flow-a), var(--flow-b) 78%, transparent);
    transform-origin:top;
    animation:grow 1.1s cubic-bezier(.22,.9,.3,1) both;
  }
  @keyframes grow{ from{transform:scaleY(0)} to{transform:scaleY(1)} }

  .knot{
    position:absolute;
    left:calc(var(--spine-x) * -1 - 5px);
    top:.52em;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--flow-a);
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }

  /* ---------- 見出し ---------- */
  header{position:relative;margin-bottom:clamp(48px,10vh,84px)}
  header .knot{border-color:var(--ink);background:var(--ink)}
  h1{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(30px,7.4vw,42px);
    letter-spacing:.3em;
    margin:0;
    line-height:1.25;
  }
  .tagline{
    margin:.9em 0 0;
    color:var(--muted);
    font-size:clamp(13px,3.2vw,15px);
    letter-spacing:.05em;
    max-width:34em;
  }

  /* ---------- 作品 ---------- */
  .work{
    position:relative;
    display:block;
    text-decoration:none;
    padding:20px 22px 22px;
    margin:0 0 clamp(30px,6vh,48px) -22px;
    border-radius:14px;
    transition:background .2s ease;
  }
  .work:hover,.work:focus-visible{background:var(--paper-2)}
  .work:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .work:hover .knot,.work:focus-visible .knot{
    background:var(--accent);
    border-color:var(--accent);
    transform:scale(1.25);
  }
  .work .knot{left:calc(var(--spine-x) * -1 - 5px + 22px)}  /* ネガティブマージン分を戻す */

  .work .date{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    color:var(--muted);
  }
  .work h2{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(22px,5.4vw,28px);
    letter-spacing:.22em;
    margin:.25em 0 .3em;
    line-height:1.3;
    display:flex;
    align-items:center;
    gap:.55em;
  }
  .work p{
    margin:0;
    font-size:clamp(13px,3.2vw,15px);
    color:var(--ink);
    max-width:30em;
  }
  .work .tags{
    margin-top:.9em;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .work .tags span{
    font-size:11px;
    letter-spacing:.12em;
    color:var(--muted);
    border:1px solid rgba(35,40,42,.22);
    border-radius:999px;
    padding:3px 11px;
  }

  /* むすぶの印：角の駒。カードに触れると回って線がつながる */
  .mark{flex:0 0 auto;width:.95em;height:.95em}
  .mark .elbow{
    transform-origin:50% 50%;
    transition:transform .35s cubic-bezier(.34,1.4,.5,1);
  }
  .work:hover .mark .elbow,.work:focus-visible .mark .elbow{transform:rotate(90deg)}

  /* くみたてるの印：触れると部品が持ち上がる */
  .mark.build path{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .mark.build .ghost path{stroke:rgba(35,40,42,.18)}
  .mark.build .lift path{stroke:var(--flow-b)}
  .mark.build .lift{
    transform-origin:50% 50%;
    transition:transform .35s cubic-bezier(.34,1.3,.5,1);
  }
  .work:hover .mark.build .lift,
  .work:focus-visible .mark.build .lift{transform:translateY(-2.6px)}

  /* ---------- つくりかけ ---------- */
  .soon{position:relative;color:var(--muted)}
  .soon .knot{border-style:dashed;border-color:var(--muted)}
  .soon p{
    margin:0;
    font-size:clamp(13px,3.2vw,15px);
    letter-spacing:.05em;
  }

  footer{
    margin-top:clamp(56px,12vh,96px);
    padding-left:var(--spine-x);
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
  }
  footer a{text-underline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    .spine::before{animation:none}
    .mark .elbow,.knot{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>
<div class="page">
  <div class="spine">

    <header>
      <span class="knot" aria-hidden="true"></span>
      <!-- サイト名はここ。og:title / title タグも忘れずに -->
      <h1>あそびば</h1>
      <p class="tagline">ちいさなブラウザゲームの置き場。ひとつずつ、この線の先に増えていきます。</p>
    </header>

    <a class="work" href="./musubu/">
      <span class="knot" aria-hidden="true"></span>
      <span class="date">2026.08</span>
      <h2>
        むすぶ
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 16 H16" fill="none" stroke="#16A0A6" stroke-width="4.5" stroke-linecap="round"/>
          <g class="elbow">
            <path d="M16 29 Q16 16 29 16" fill="none" stroke="#3D3AA8" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        </svg>
      </h2>
      <p>図形をタップして回し、線の端をすべてつなぐパズル。つながるほど色が流れ、音が高くなっていきます。</p>
      <span class="tags"><span>パズル</span><span>音が鳴る</span><span>無限に遊べる</span></span>
    </a>

    <a class="work" href="./kumitateru/">
      <span class="knot" aria-hidden="true"></span>
      <span class="date">2026.08</span>
      <h2>
        くみたてる
        <svg class="mark build" viewBox="0 0 32 32" aria-hidden="true">
          <g class="ghost">
            <path d="M16 6 V26 M7 12 H25 M16 12 L8 25 M16 12 L24 25"/>
          </g>
          <g class="lift">
            <path d="M16 4 V24 M7 10 H25 M16 10 L8 23 M16 10 L24 23"/>
          </g>
        </svg>
      </h2>
      <p>部品を台に並べて漢字をつくるパズル。木と木で林、林と木で森。組み上げた字が、次の部品になります。</p>
      <span class="tags"><span>組み立て</span><span>実際の字形</span><span>常用漢字2136字</span></span>
    </a>

    <div class="soon">
      <span class="knot" aria-hidden="true"></span>
      <p>つくりかけ — つぎの一手を考え中。</p>
    </div>

  </div>

  <footer>
    <!-- ▼ ご自分のアカウントに書き換えてください -->
    <a href="https://x.com/Ken_logs">X で新作をお知らせします</a>
  </footer>
</div>
</body>
</html>
